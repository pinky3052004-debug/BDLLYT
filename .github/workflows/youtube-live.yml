name: Sequential YouTube Live

on:
  workflow_dispatch:

jobs:
  youtube-live:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RCLONE_REMOTE: mydrive
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq unzip python3-pip
          curl https://rclone.org/install.sh | sudo bash
          pip3 install --no-cache-dir google-api-python-client google-auth-oauthlib

      - name: Restore rclone config
        run: |
          set -e
          mkdir -p "$HOME/.config/rclone"
          printf '%s' '${{ secrets.RCLONE_CONFIG }}' > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Prepare already live record
        run: |
          if [ ! -f already_live.txt ]; then
            touch already_live.txt
          fi

      - name: Find next video
        id: select
        run: |
          set -e
          mkdir -p work

          # work folder ထဲမှာရှိတဲ့ mp4 ဖိုင်များကို ရှာပြီး ID များကို ထုတ်ယူမည် (ဥပမာ 00001.mp4 မှ 1 ကို ယူမည်)
          rclone lsf "${RCLONE_REMOTE}:" \
            --drive-root-folder-id "$GOOGLE_DRIVE_FOLDER_ID" \
            --files-only \
            --include "*.mp4" \
            | sed 's/\.mp4$//' | sed 's/^0*//' | sed 's/^$/0/' \
            | sort -n > work/all_ids.txt

          echo "Found video IDs in Google Drive:"
          cat work/all_ids.txt

          NEXT_ID=""
          while IFS= read -r ID; do
            if [ -n "$ID" ] && ! grep -Fxq "$ID" already_live.txt; then
              NEXT_ID="$ID"
              break
            fi
          done < work/all_ids.txt

          if [ -z "$NEXT_ID" ]; then
            echo "has_next=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PADDED_ID="$(printf '%05d' "$NEXT_ID")"
          echo "has_next=true" >> "$GITHUB_OUTPUT"
          echo "id=$NEXT_ID" >> "$GITHUB_OUTPUT"
          echo "padded_id=$PADDED_ID" >> "$GITHUB_OUTPUT"
          echo "video=${PADDED_ID}.mp4" >> "$GITHUB_OUTPUT"
          echo "thumbnail=${PADDED_ID}.jpg" >> "$GITHUB_OUTPUT"

      - name: Check selected files in Google Drive
        if: steps.select.outputs.has_next == 'true'
        run: |
          set -e
          VIDEO="${{ steps.select.outputs.video }}"
          THUMB="${{ steps.select.outputs.thumbnail }}"

          rclone lsf "${RCLONE_REMOTE}:" --drive-root-folder-id "$GOOGLE_DRIVE_FOLDER_ID" --files-only --include "$VIDEO" | grep -Fxq "$VIDEO"
          rclone lsf "${RCLONE_REMOTE}:" --drive-root-folder-id "$GOOGLE_DRIVE_FOLDER_ID" --files-only --include "$THUMB" | grep -Fxq "$THUMB"

      - name: Download video and thumbnail
        if: steps.select.outputs.has_next == 'true'
        run: |
          set -e
          VIDEO="${{ steps.select.outputs.video }}"
          THUMB="${{ steps.select.outputs.thumbnail }}"

          rclone copyto "${RCLONE_REMOTE}:${VIDEO}" "work/${VIDEO}" --drive-root-folder-id "$GOOGLE_DRIVE_FOLDER_ID" --progress
          rclone copyto "${RCLONE_REMOTE}:${THUMB}" "work/${THUMB}" --drive-root-folder-id "$GOOGLE_DRIVE_FOLDER_ID" --progress

      - name: Update YouTube Metadata and Thumbnail (Default Values)
        if: steps.select.outputs.has_next == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_BROADCAST_ID: ${{ secrets.YOUTUBE_BROADCAST_ID }}
          NEXT_ID: ${{ steps.select.outputs.id }}
        run: |
          python3 - << 'EOF'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          client_id = os.environ.get("YOUTUBE_CLIENT_ID")
          client_secret = os.environ.get("YOUTUBE_CLIENT_SECRET")
          refresh_token = os.environ.get("YOUTUBE_REFRESH_TOKEN")
          broadcast_id = os.environ.get("YOUTUBE_BROADCAST_ID")
          next_id = os.environ.get("NEXT_ID")

          # Default တန်ဖိုးများ သတ်မှတ်ခြင်း
          title = "တစ်နေ့တာအတွက် ကံကောင်းခြင်းများစွာ ပိုင်ဆိုင်ဖို့ - မဟာသမယသုတ် တရားတော် 🔴🙏"
          description = (
              "နံနက်ခင်းအချိန်တွင် ပဋ္ဌာန်းပါဠိတော်နှင့် မဟာသမယသုတ် တရားတော်များကို နာယူခြင်းဖြင့် စိတ်ချမ်းသာမှုနှင့် "
              "ကံပွင့်လာဘ်ပွင့် စီးပွားတက်စေရန် ရည်ရွယ်ပါသည်။\n\n"
              "ဤဗီဒီယိုတွင် မြတ်စွာဘုရားရှင်၏ ရုပ်ပွားတော်အား ရွှေရောင်အလင်းတန်းများဖြင့် တင့်တယ်စွာ ပူဇော်ထားပြီး "
              "ပဋ္ဌာန်းပါဠိတော်များကို ရွတ်ဖတ်သရဇ္ဈာယ်ထားသည့် တရားတော်များကို နာယူနိုင်ပါသည်။ ပဋ္ဌာန်းပါဠိတော်ကို နာယူမှတ်သားခြင်းသည် "
              "မိမိတို့၏ စိတ်နှလုံးကို အေးချမ်းစေပြီး ကုသိုလ်တရားများ တိုးပွားစေသည့် အလွန်မွန်မြတ်သော အလေ့အကျင့်တစ်ခု ဖြစ်ပါသည်။ "
              "နေ့စဉ် နံနက်ခင်းတိုင်းတွင် ဤတရားတော်များကို နာယူခြင်းဖြင့် မိမိတို့၏ ဘဝအတွက် ကောင်းမွန်သော စိတ်ဓာတ်ခွန်အားများကို "
              "ရရှိစေမည် ဖြစ်ပါသည်။\n\n"
              "ထို့အပြင် မဟာသမယသုတ် တရားတော်များကို နာယူခြင်းသည် ဘေးအန္တရာယ်ကင်းရှင်းပြီး စိတ်၏ချမ်းသာခြင်း၊ "
              "ကိုယ်၏ကျန်းမာခြင်းကို ဖြစ်ပေါ်စေပါသည်။ ဤတရားတော်များသည် ကံပွင့်လာဘ်ပွင့်စေရန်နှင့် စီးပွားရေးလုပ်ငန်းများ "
              "အဆင်ပြေချောမွေ့စေရန် ရည်ရွယ်၍ ပူဇော်ထားခြင်း ဖြစ်ပါသည်။ တရားချစ်ခင်သူတော်စင်များအနေဖြင့် ဤတရားတော်များကို "
              "အချိန်ပေး၍ နာယူခြင်းဖြင့် မိမိတို့၏ ဘဝလမ်းကြောင်းတွင် ကောင်းကျိုးများ ရရှိလာစေရန် ရည်ရွယ်ပါသည်။\n\n"
              "ဓမ္မမိတ်ဆွေများအနေဖြင့် တရားတော်များကို ဆက်လက်နာယူနိုင်ရန်အတွက် ချန်နယ်ကို Subscribe လုပ်ထားပေးပါရန် "
              "ဖိတ်ခေါ်အပ်ပါသည်။ နောင်တွင်လည်း တင်ဆက်ပေးမည့် တရားတော်များကို အတူတူ နာယူပူဇော်ကြပါစို့။"
          )
          tags = [
              "ကံပွင့်လာဘ်ပွင့်",
              "မဟာသမယသုတ်တရားတော်",
              "ပဋ္ဌာန်းပါဠိတော်",
              "ပရိတ်ကြီး၁၁သုတ်",
              "စီးပွားတက်တရားတော်",
              "နံနက်ခင်းတရားတော်",
              "မေတ္တာပို့တရားတော်",
              "ပါချုပ်ဆရာတော်ဘုရားကြီးတရားတော်များ",
              "မင်းကွန်းဆရာတော်တရား",
              "ဓမ္မစကြာတရားတော်",
              "ဂုဏ်တော်ကိုးပါး",
              "လာဘ်ပွင့်ဂါထာတော်",
              "အစွမ်းထက်ဂါထာတော်",
              "ဘေးအန္တရာယ်ကင်းပရိတ်တရားတော်",
              "ပဌာန်းဒေသနာတော်",
              "တရားတော်များ 2026",
              "တရားတော်များ",
              "dhamma channel myanmar",
              "dhammatalk",
              "tayar taw myanmar"
          ]
          creds = Credentials(None, refresh_token=refresh_token, client_id=client_id, client_secret=client_secret, token_uri="https://oauth2.googleapis.com/token")
          youtube = build("youtube", "v3", credentials=creds)

          youtube.liveBroadcasts().update(
              part="snippet",
              body={"id": broadcast_id, "snippet": {"title": title, "description": description}}
          ).execute()

          try:
              youtube.videos().update(
                  part="snippet",
                  body={"id": broadcast_id, "snippet": {"title": title, "description": description, "categoryId": "24", "tags": tags}}
              ).execute()
          except Exception as e:
              print(f"Tags update warning: {e}")

          padded_id = f"{int(next_id):05d}"
          thumb_path = f"work/{padded_id}.jpg"
          if os.path.exists(thumb_path):
              youtube.thumbnails().set(videoId=broadcast_id, media_body=MediaFileUpload(thumb_path)).execute()
          EOF

      - name: Start YouTube Live
        if: steps.select.outputs.has_next == 'true'
        run: |
          VIDEO="work/${{ steps.select.outputs.video }}"
          ffmpeg -hide_banner -loglevel info -re -i "$VIDEO" -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p -r 30 -g 60 -keyint_min 60 -b:v 4500k -maxrate 4500k -bufsize 9000k -c:a aac -b:a 128k -ar 44100 -f flv "rtmps://a.rtmps.youtube.com/live2/${YOUTUBE_STREAM_KEY}"

      - name: Mark as already live
        if: success() && steps.select.outputs.has_next == 'true'
        run: |
          ID="${{ steps.select.outputs.id }}"
          if ! grep -Fxq "$ID" already_live.txt; then
            echo "$ID" >> already_live.txt
          fi
          sort -n -o already_live.txt already_live.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add already_live.txt
          git diff --cached --quiet || (git commit -m "Mark $ID as already live" && git push)
